<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planet VPN - Descarga para Android</title>
    <meta name="description" content="Descarga Planet VPN gratis para Android. VPN rápida, segura y sin registros.">
    <!-- 设置安卓浏览器顶栏颜色 -->
    <meta name="theme-color" content="#121212">
    <style>
        /* --- 核心重置 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* --- 手机容器 --- */
        .mobile-wrapper {
            width: 100%;
            max-width: 480px;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* --- 导航 --- */
        .navbar {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .brand {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .brand span { color: #00ff88; }

        /* --- 主视觉 --- */
        .hero-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            text-align: center;
        }

        .app-icon {
            width: 96px;
            height: 96px;
            background: linear-gradient(135deg, #2b3240 0%, #1a1d24 100%);
            border-radius: 22px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.2);
            border: 1px solid #333;
        }

        .title {
            font-size: 28px; /* 稍微调大以突显品牌 */
            font-weight: 800;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 15px;
            color: #999;
            margin-bottom: 30px;
            line-height: 1.5;
            max-width: 300px; /* 限制宽度防止文字过长难读 */
        }

        /* --- 标签 --- */
        .tags {
            display: flex;
            flex-wrap: wrap; /* 允许西语长词换行 */
            gap: 8px;
            margin-bottom: 40px;
            justify-content: center;
        }
        
        .tag {
            background: rgba(255,255,255,0.1);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #ccc;
            white-space: nowrap;
        }

        /* --- 底部操作栏 --- */
        .action-bar {
            padding: 24px;
            background: linear-gradient(to top, #121212 80%, rgba(18,18,18,0));
            position: sticky;
            bottom: 0;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 56px;
            border-radius: 28px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.1s;
            margin-bottom: 12px;
            text-transform: uppercase; /* 西语按钮习惯大写更显有力 */
            letter-spacing: 0.5px;
        }

        .btn:active { transform: scale(0.98); }

        .btn-primary {
            background-color: #00ff88;
            color: #000;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.4);
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid #333;
            color: #fff;
        }

        .safe-badge {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .safe-badge span { color: #00ff88; }

        /* --- 统计 --- */
        .stats {
            display: flex;
            width: 100%;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
            padding: 20px 0;
            margin-bottom: 20px;
        }
        
        .stat-item { flex: 1; text-align: center; }
        .stat-val { font-size: 18px; font-weight: bold; color: #fff; }
        .stat-label { font-size: 11px; color: #666; margin-top: 4px; text-transform: uppercase;}
        .stat-border { border-right: 1px solid #222; }

    </style>
</head>
<body>

    <div class="mobile-wrapper">
        <!-- 顶部 -->
        <div class="navbar">
            <div class="brand">Planet<span>VPN</span></div>
        </div>

        <!-- 主内容 -->
        <div class="hero-section">
            <div class="app-icon">🚀</div>

            <h1 class="title">Planet VPN<br>Para Android</h1>
            <p class="subtitle">Gratis para siempre · Cifrado militar · Navegación anónima y segura</p>

            <div class="tags">
                <span class="tag">Sin Registro</span>
                <span class="tag">Ilimitado</span>
                <span class="tag">Android 5.0+</span>
            </div>

            <!-- 数据展示 (西语) -->
            <div class="stats">
                <div class="stat-item stat-border">
                    <div class="stat-val">4.8★</div>
                    <div class="stat-label">Valoración</div>
                </div>
                <div class="stat-item stat-border">
                    <div class="stat-val">5M+</div>
                    <div class="stat-label">Descargas</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val">Lite</div>
                    <div class="stat-label">Tamaño</div>
                </div>
            </div>
        </div>

        <!-- 底部按钮区 -->
        <div class="action-bar">
            <!-- 下载 APK -->
            <a href="tu-archivo-aqui.apk" class="btn btn-primary">
                📥 Descargar APK
            </a>
            
            <!-- Google Play -->
            <a href="https://play.google.com/store/apps/details?id=com.freevpn.planet" class="btn btn-outline">
                Google Play Store
            </a>

            <div class="safe-badge">
                <span>🛡️</span> 100% Seguro · Versión Oficial
            </div>
        </div>
    </div>

</body>
</html>
